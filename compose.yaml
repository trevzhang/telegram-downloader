services:
  tgdl:
    build: .
    image: tgdl:latest
    container_name: tgdl
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内 127.0.0.1 是容器自身，代理地址自动改为宿主机；代理在别的机器时在 .env 里设 DOCKER_PROXY_HOST=<IP>
      PROXY_HOST: ${DOCKER_PROXY_HOST-host.docker.internal}
    volumes:
      - ./data:/data
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
    extra_hosts:
      - host.docker.internal:host-gateway
    # NAS 上建议改成拥有下载目录写权限的用户，如 "1026:100"
    user: ${PUID:-0}:${PGID:-0}
    stdin_open: true
    tty: true
    stop_grace_period: 30s
